[project]
name = "check-no-comments"
version = "1.2.0"
description = "Fails when a repository has comments written for people; lets comments that tools read through."
authors = [
    { name = "Manos Liodakis", email = "manosliod@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "tree-sitter-language-pack==1.22.1",
]

[project.scripts]
check-no-comments = "check_no_comments:cli"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
