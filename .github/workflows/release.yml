name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    uses: ./.github/workflows/release-please.yml
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
      auto-merge: true
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  move-tags:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: v${{ needs.release-please.outputs.major }}
          MINOR: v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
        run: |
          git tag -f "$MINOR" "$TAG"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "$MINOR" "$MAJOR"
